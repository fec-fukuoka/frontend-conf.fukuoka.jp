# NOTE: 掲載は承認制。バリデーション通過後に運営が `sub-event:approved` ラベルを
# 手動で付与した Issue だけがサイトに掲載される（src/lib/sub-events/constants.ts の
# SUB_EVENT_APPROVED_LABEL と同期すること）。
name: Validate Sub-Event

on:
  issues:
    types: [opened, edited, labeled]

jobs:
  validate:
    runs-on: ubuntu-latest
    if: github.event.action != 'labeled' && contains(join(github.event.issue.labels.*.name, ','), 'sub-event')
    steps:
      - name: Generate token
        id: generate_token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.FEC_BOT_APP_ID }}
          private_key: ${{ secrets.FEC_BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.21.1"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # サイト掲載時と同じパーサー（src/lib/sub-events/parser.ts）で検証する
      - name: Validate sub-event content
        id: validate
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: pnpm exec tsx scripts/validate-sub-event-issue.ts

      - name: Add validation comment
        uses: actions/github-script@v7
        env:
          VALIDATION_RESULT: ${{ steps.validate.outputs.result }}
        with:
          github-token: ${{ steps.generate_token.outputs.token }}
          script: |
            const result = JSON.parse(process.env.VALIDATION_RESULT);
            const issue_number = context.issue.number;
            const marker = '<!-- sub-event-validation-comment -->';

            // Remove previous validation comments
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
            });
            for (const comment of comments.data) {
              if (comment.body.includes(marker)) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            let commentBody = marker + '\n';
            if (result.valid) {
              commentBody += '## ✅ サブイベント登録を受け付けました / Sub-event registration received\n\n';
              commentBody += '入力内容のチェックを通過しました。運営が内容を確認し、承認（`sub-event:approved` ラベルの付与）後に[公式サイトのサブイベント一覧](https://frontend-conf.fukuoka.jp/sub-events)に掲載されます。\n\n';
              commentBody += 'All checks passed. The organizers will review this submission; once approved (labeled `sub-event:approved`), the event will be listed on the [official sub-events page](https://frontend-conf.fukuoka.jp/sub-events).\n\n';
              commentBody += 'cc @fec-fukuoka/fecf-admin 内容の確認と承認をお願いします / Please review and approve.\n';
            } else {
              commentBody += '## ⚠️ 入力内容に問題があります / Validation failed\n\n';
              commentBody += 'このままでは運営の承認・掲載に進めません。以下を修正して Issue 本文を編集すると、自動で再チェックされます。\n\n';
              commentBody += 'The submission cannot be approved or listed until the following problems are fixed. Editing the issue body re-runs this check automatically.\n\n';
              commentBody += '```\n';
              for (const reason of result.reasons) {
                // コードフェンス破りを防ぐためバッククォートを除去して 300 文字に切り詰める
                commentBody += `- ${String(reason).replaceAll('`', "'").slice(0, 300)}\n`;
              }
              commentBody += '```\n\n';
              commentBody += '参考 / Reference: [サブイベント掲載ガイド / Sub-Events Guide](https://github.com/fec-fukuoka/frontend-conf.fukuoka.jp/wiki/Sub-Events)\n';
            }

            // 承認済み Issue が編集された場合は掲載を一時停止する（後続ステップでラベルを外す）
            const currentLabels = context.payload.issue.labels.map((l) => l.name);
            if (context.payload.action === 'edited' && currentLabels.includes('sub-event:approved')) {
              commentBody += '\n> [!NOTE]\n';
              commentBody += '> 内容が編集されたため、掲載を一時停止しました。運営の再承認後に再掲載されます。\n';
              commentBody += '> The event has been unlisted because the content was edited. It will be listed again after the organizers re-approve it.\n';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              body: commentBody,
            });

      - name: Update validation labels
        uses: actions/github-script@v7
        env:
          VALIDATION_RESULT: ${{ steps.validate.outputs.result }}
        with:
          github-token: ${{ steps.generate_token.outputs.token }}
          script: |
            const result = JSON.parse(process.env.VALIDATION_RESULT);
            const issue_number = context.issue.number;
            const currentLabels = context.payload.issue.labels.map((l) => l.name);

            // 承認後に内容が編集された場合は承認を取り消し、再承認まで掲載を停止する
            if (context.payload.action === 'edited' && currentLabels.includes('sub-event:approved')) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue_number,
                  name: 'sub-event:approved',
                });
              } catch (error) {
                // Label might already be removed, ignore
              }
            }

            if (result.valid) {
              if (currentLabels.includes('needs-fix')) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue_number,
                    name: 'needs-fix',
                  });
                } catch (error) {
                  // Label might already be removed, ignore
                }
              }
            } else {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue_number,
                labels: ['needs-fix'],
              });
            }

  # 運営が sub-event:approved ラベルを付与（承認）したら掲載開始を通知する
  notify-approval:
    runs-on: ubuntu-latest
    if: github.event.action == 'labeled' && github.event.label.name == 'sub-event:approved'
    steps:
      - name: Generate token
        id: generate_token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.FEC_BOT_APP_ID }}
          private_key: ${{ secrets.FEC_BOT_PRIVATE_KEY }}

      - name: Add approval comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.generate_token.outputs.token }}
          script: |
            const issue_number = context.issue.number;
            const marker = '<!-- sub-event-approval-comment -->';

            // Remove previous approval comments (再承認時に重複しないように)
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
            });
            for (const comment of comments.data) {
              if (comment.body.includes(marker)) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            let commentBody = marker + '\n';
            commentBody += '## 🎉 掲載が承認されました / Approved for publication\n\n';
            commentBody += 'この Issue が open かつ `sub-event` / `sub-event:approved` ラベル付きの間、[公式サイトのサブイベント一覧](https://frontend-conf.fukuoka.jp/sub-events)に掲載されます（反映まで最大数分かかります）。\n';
            commentBody += 'Issue 本文を編集すると掲載は一時停止され、運営の再承認後に再掲載されます。\n\n';
            commentBody += 'While this issue stays open with the `sub-event` and `sub-event:approved` labels, the event is listed on the [official sub-events page](https://frontend-conf.fukuoka.jp/sub-events). Updates may take a few minutes.\n';
            commentBody += 'Editing the issue body temporarily unlists the event until the organizers re-approve it.\n';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              body: commentBody,
            });
